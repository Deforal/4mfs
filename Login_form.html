<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
    <title>Главная</title>
    <script src="./script.js"></script>
</head>
<body>
<header class="header_mass" data-header="Login">
</header>
<Main>
<div class="bread_crumbs bread_crumbs_withbd">
    <a href="index.html">Главная</a>
    <p>/ Регистрация|Вход</p>
</div>
    <div class="form_holder center" data-form="log_reg">
        <form method="post" class="form_reg" id="reg_form">
            <h2 class="payment_header center">Регистрация</h2> 
            <p class="form_name center">E-mail:</p>
            <input data-register="email" type="email" name="email" class="form_textbox" placeholder="example@mail.ru" required>
            <p class="form_name center">Имя пользователя:</p>
            <input data-register="username" type="text" name="username" class="form_textbox" placeholder="Имя пользователя" required>
            <p class="form_name center">Пароль:</p>
            <input data-register="password" type="password" name="password" class="form_textbox" required>
            <p class="form_name center">Подтверждение пароля:</p>
            <input data-register="Rpassword" type="password" name="confirm_password" class="form_textbox" required>
            <p class="form_error center">SOmething</p>
            <button type="submit" class="form_submit" >Зарегестрироваться</button>
        </form>
        <form method="" class="form_log" id="log_form">
            <h2 class="payment_header center">Вход</h2> 
            <p class="form_name center">E-mail:</p>
            <input data-login="email" type="email" name="email" class="form_textbox" placeholder="example@mail.ru" required>
            <p class="form_name center">Пароль:</p>
            <input data-login="password" type="password" name="password" class="form_textbox" required>
            <p class="form_error center">SOmething</p>
            <button type="submit" class="form_submit" >Войти</button>
        </form>
    </div>

</Main>
<footer class="footer">
    
</footer>
</body>
</html>
